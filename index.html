<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AML実践 CBT問題アプリ（全50問）</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface-alt: #f8fafc;
      --text: #0f172a;
      --muted: #475569;
      --border: #e2e8f0;
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --primary-soft: #eff6ff;
      --success: #15803d;
      --success-soft: #f0fdf4;
      --success-border: #86efac;
      --danger: #b91c1c;
      --danger-soft: #fef2f2;
      --danger-border: #fca5a5;
      --warn: #b45309;
      --warn-soft: #fffbeb;
      --warn-border: #fcd34d;
      --radius: 12px;
      --shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }

    header {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      color: #fff;
      padding: 18px 24px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.15);
    }

    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.25rem;
      letter-spacing: 0.02em;
    }

    .brand p {
      margin: 3px 0 0;
      font-size: 0.82rem;
      color: #cbd5e1;
    }

    .header-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .badge-pill {
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      transition: all 0.15s ease;
    }

    button:hover:not(:disabled) {
      background: var(--surface-alt);
      border-color: #cbd5e1;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button.btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    button.btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    button.btn-ghost-light {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.3);
      color: #fff;
    }

    button.btn-ghost-light:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.2);
    }

    .container {
      max-width: 1120px;
      margin: 22px auto 48px;
      padding: 0 18px;
    }

    .toolbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    select, label.toggle-check {
      font-family: inherit;
      font-size: 0.86rem;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--text);
    }

    label.toggle-check {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 290px;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .q-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .q-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .q-num {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--primary);
    }

    .q-cat {
      background: var(--primary-soft);
      color: var(--primary);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .flag-btn.flagged {
      background: var(--warn-soft);
      border-color: var(--warn-border);
      color: var(--warn);
    }

    .q-stem {
      font-size: 1.05rem;
      font-weight: 600;
      margin: 0 0 18px;
      white-space: pre-line;
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .choice-btn {
      width: 100%;
      text-align: left;
      padding: 13px 16px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.5;
    }

    .choice-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .choice-key {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--surface-alt);
      border: 1px solid #cbd5e1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .choice-btn.selected {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .choice-btn.correct {
      border-color: var(--success);
      background: var(--success-soft);
      color: var(--success);
    }

    .choice-btn.correct .choice-key {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }

    .choice-btn.incorrect {
      border-color: var(--danger);
      background: var(--danger-soft);
      color: var(--danger);
    }

    .choice-btn.incorrect .choice-key {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    .explanation-box {
      margin-top: 20px;
      padding: 16px 18px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
    }

    .explanation-box.is-correct {
      background: var(--success-soft);
      border-color: var(--success-border);
    }

    .explanation-box.is-incorrect {
      background: var(--danger-soft);
      border-color: var(--danger-border);
    }

    .exp-title {
      font-weight: 700;
      font-size: 0.98rem;
      margin: 0 0 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .exp-body {
      margin: 0;
      font-size: 0.92rem;
      color: var(--text);
    }

    .q-nav {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .palette-card h2 {
      margin: 0 0 10px;
      font-size: 0.98rem;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.76rem;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      display: inline-block;
    }

    .palette-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .pal-btn {
      padding: 6px 0;
      font-size: 0.8rem;
      border-radius: 6px;
      font-variant-numeric: tabular-nums;
      position: relative;
    }

    .pal-btn.current {
      outline: 2px solid var(--primary);
      outline-offset: 1px;
      font-weight: 700;
    }

    .pal-btn.p-correct {
      background: var(--success-soft);
      border-color: var(--success-border);
      color: var(--success);
    }

    .pal-btn.p-incorrect {
      background: var(--danger-soft);
      border-color: var(--danger-border);
      color: var(--danger);
    }

    .pal-btn.p-flagged::after {
      content: "★";
      position: absolute;
      top: 1px;
      right: 3px;
      font-size: 0.62rem;
      color: var(--warn);
    }

    .stats-mini {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 0.84rem;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .summary-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 14px;
      font-size: 0.9rem;
    }

    .summary-table th,
    .summary-table td {
      border-bottom: 1px solid var(--border);
      padding: 10px 8px;
      text-align: left;
    }

    .summary-table th {
      color: var(--muted);
      font-size: 0.82rem;
    }

    .empty-state {
      text-align: center;
      padding: 36px 16px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <h1>AML実践 CBT問題アプリ（全50問）</h1>
        <p>顧客管理（CDD/EDD）・取引モニタリング・疑わしい取引の届出（STR）・金融制裁・内部管理態勢</p>
      </div>
      <div class="header-controls">
        <span class="badge-pill" id="scoreBadge">正答: 0 / 0</span>
        <span class="badge-pill" id="timerBadge">経過: 00:00</span>
        <button class="btn-ghost-light" id="toggleSummaryBtn">成績サマリー</button>
        <button class="btn-ghost-light" id="resetBtn">履歴リセット</button>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="toolbar">
      <div class="filter-group">
        <select id="categoryFilter" aria-label="分野選択">
          <option value="ALL">全分野（50問）</option>
          <option value="顧客管理（CDD/EDD）">顧客管理（CDD/EDD）</option>
          <option value="取引モニタリング・分析">取引モニタリング・分析</option>
          <option value="疑わしい取引の届出（STR）">疑わしい取引の届出（STR）</option>
          <option value="金融制裁・海外送金・暗号資産">金融制裁・海外送金・暗号資産</option>
          <option value="内部管理態勢・3線ディフェンス">内部管理態勢・3線ディフェンス</option>
        </select>

        <select id="subsetFilter" aria-label="出題対象">
          <option value="ALL">すべての対象問題</option>
          <option value="WRONG">過去に間違えた問題のみ</option>
          <option value="FLAGGED">フラグ付き問題のみ</option>
          <option value="UNANSWERED">未解答の問題のみ</option>
        </select>

        <button id="shuffleBtn">出題順シャッフル</button>
      </div>

      <div class="filter-group">
        <label class="toggle-check">
          <input type="checkbox" id="autoRevealCheck" checked />
          解答後に解説を表示
        </label>
        <label class="toggle-check">
          <input type="checkbox" id="shuffleChoicesCheck" />
          選択肢シャッフル
        </label>
      </div>
    </div>

    <div id="summaryView" class="card" style="display:none; margin-bottom:20px;">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
        <h2 style="margin:0;">分野別 学習成績サマリー</h2>
        <div>
          <button class="btn-primary" id="retryWrongBtn">間違えた問題だけ再挑戦</button>
          <button id="closeSummaryBtn">問題画面に戻る</button>
        </div>
      </div>
      <div id="summaryContent"></div>
    </div>

    <div class="main-grid" id="quizGrid">
      <section class="card" id="questionCard"></section>

      <aside class="card palette-card">
        <h2>問題ナビゲーション</h2>
        <div class="legend">
          <span><i class="dot" style="background:var(--success-soft); border:1px solid var(--success-border);"></i>正解</span>
          <span><i class="dot" style="background:var(--danger-soft); border:1px solid var(--danger-border);"></i>不正解</span>
          <span><i class="dot" style="background:var(--warn-soft); border:1px solid var(--warn-border);"></i>★要復習</span>
        </div>
        <div class="palette-grid" id="paletteGrid"></div>
        <div class="stats-mini" id="miniStats"></div>
      </aside>
    </div>
  </div>

  <script>
    const QUESTIONS = [
      // 1. 顧客管理（CDD/EDD）（10問）
      {
        id: 1,
        category: "顧客管理（CDD/EDD）",
        stem: "法人顧客との新規取引開始時における実質的支配者の確認について、実務上最も適切な対応はどれか。",
        choices: [
          "登記簿謄本（履歴事項全部証明書）の記載だけで実質的支配者の特定を完了とする",
          "議決権の25%超を直接・間接に保有する自然人の有無を確認し、該当者がいない場合は事業経営を実質的に支配する自然人を確認する",
          "代表取締役本人の口頭申告のみで実質的支配者を登録し、裏付け資料は求めない",
          "上場企業の連結子会社であれば、親会社の上場区分に関わらず実質的支配者の確認を一切省略できる"
        ],
        answer: 1,
        explanation: "法人顧客では、議決権等の25%超を直接・間接に保有する自然人（または事業経営を実質的に支配する自然人）を確認することが基本です。上場会社等は例外規定の対象となりますが、確認プロセスと根拠資料の整合性が重要です。"
      },
      {
        id: 2,
        category: "顧客管理（CDD/EDD）",
        stem: "強化された顧客管理（EDD）が必要となる典型的なケースとして、最も不適切なものはどれか。",
        choices: [
          "顧客または実質的支配者が外国PEPs（重要な公的地位にある者）に該当する場合",
          "犯罪収益移転防止法上の特定取引に該当し、なりすましや虚偽申告の疑いがある場合",
          "FATFが協力を要請する高リスク国・地域と関連する取引や送金が含まれる場合",
          "給与振込口座を長年利用している国内居住の個人顧客が、通常の生活費決済を行う場合"
        ],
        answer: 3,
        explanation: "外国PEPs、高リスク国・地域関連、疑義のある取引等はEDDの対象となります。通常の国内居住者の生活費決済は通常管理（CDD）の範囲であり、一律にEDDを要するものではありません。"
      },
      {
        id: 3,
        category: "顧客管理（CDD/EDD）",
        stem: "外国PEPs（Politically Exposed Persons）に該当する顧客への対応として、実務上求められる措置はどれか。",
        choices: [
          "取引開始時の厳格な本人確認に加え、資産・収入の状況確認や定期的な顧客情報更新などリスクに応じた措置を講じる",
          "外国PEPsであっても国内の公職経験者と同等に扱い、追加確認は行わない",
          "外国PEPsに該当した時点で、理由の説明なくすべての既存口座を即時解約しなければならない",
          "確認対象は本人のみであり、家族や実質的支配者が外国PEPsである場合は対象外となる"
        ],
        answer: 0,
        explanation: "外国PEPsはマネロン・腐敗資金洗浄リスクが高いため、厳格な確認、資産・収入の状況確認、継続的顧客管理（情報更新・モニタリング強化）をリスクに応じて実施します。本人だけでなく家族や実質的支配者も確認対象となります。"
      },
      {
        id: 4,
        category: "顧客管理（CDD/EDD）",
        stem: "継続的顧客管理（Ongoing CDD）における顧客情報の定期・随時更新の意義として、最も適切なものはどれか。",
        choices: [
          "口座開設時に一度確認すれば、顧客の職業・事業内容や取引実態が変わっても再確認は不要である",
          "顧客の属性・事業内容・リスク評価の変化を把握し、取引モニタリングの前提となる顧客プロファイルを最新化するため",
          "休眠口座を強制的に解約するための事務手続きとしてのみ実施される",
          "システム上のバッチ処理だけで完結し、営業店や担当者の実態把握は不要である"
        ],
        answer: 1,
        explanation: "顧客の職業、事業内容、実質的支配者、資金源等は時間とともに変化します。継続的顧客管理により顧客リスク評価とモニタリング基準を最新状態に保つことがAML実務の要諦です。"
      },
      {
        id: 5,
        category: "顧客管理（CDD/EDD）",
        stem: "非対面取引（インターネットバンキングやアプリ申込等）における本人確認で留意すべき実務上のポイントはどれか。",
        choices: [
          "なりすましや撮影画像の改ざん・AI加工リスクを踏まえ、確認方式の要件と内部統制ルールを厳格に遵守する",
          "非対面取引は対面よりリスクが低いため、本人確認書類の有効期限や住所一致の確認は省略できる",
          "本人確認書類の画像が不鮮明でも、電話番号が通じれば確認完了としてよい",
          "初回振込上限額を無制限に設定したうえで、後から本人確認を行えばよい"
        ],
        answer: 0,
        explanation: "非対面チャネルはなりすましや不正取得アカウントの温床になりやすいため、法令・ガイドラインに沿った本人確認手法の適用と、初期取引制限や不審な端末・IP検知等の対策が不可欠です。"
      },
      {
        id: 6,
        category: "顧客管理（CDD/EDD）",
        stem: "顧客のリスク格付（リスクスコアリング）において、総合評価を引き上げる要因となりにくいものはどれか。",
        choices: [
          "現金集約型ビジネスや換金性の高い資産を扱う業態であること",
          "国境を越えた資金移動や複雑・不透明な法人ストラクチャーを有すること",
          "登録された職業・事業内容および取引パターンが安定しており、説明と整合していること",
          "過去に疑わしい取引の届出対象となった経緯や不自然な取引照会があること"
        ],
        answer: 2,
        explanation: "業態特性（現金多用・換金性）、地理的リスク、複雑なストラクチャー、過去の不審取引履歴はリスクを高める要因です。申告内容と実態が整合し安定している場合はリスクを押し上げる要因になりにくいです。"
      },
      {
        id: 7,
        category: "顧客管理（CDD/EDD）",
        stem: "法人顧客の「事業内容・取引目的・資金源」を確認する実務上の目的として、最も適切なものはどれか。",
        choices: [
          "営業担当者のノルマ達成度を計算するため",
          "実際の入出金規模や取引相手先が、申告された正当な事業活動と合理的に整合しているかを判断するため",
          "法人税の確定申告書を金融機関が代理作成するため",
          "金利優遇の可否を顧客の好みで決めるため"
        ],
        answer: 1,
        explanation: "事業内容や取引目的・資金源を確認するのは、将来の取引が「その顧客のビジネス実態として自然か（不自然な資金の流れではないか）」を見極めるための基準を作るためです。"
      },
      {

        stem: "営業目標や業績評価とAML/CFTのバランスを取るうえで、組織として留意すべき点はどれか。",
        choices: [
          "口座獲得や送金件数などの営業実績だけを重視し、CDD不備や不審取引の見過ごしを看過する評価制度にしない",
          "コンプライアンス違反が起きても、営業成績が高ければすべて不問とする",
          "AML/CFT担当者の評価を、疑わしい取引の届出件数「ゼロ」に設定する",
          "営業部門とコンプライアンス部門は完全に断絶し、情報共有を行わない"
        ],
        answer: 0,
        explanation: "過度な業績偏重や不適切なKPI設定は、確認の省略や不審点の隠蔽を誘発するおそれがあります。健全なリスクカルチャーと適切な評価・牽制の仕組みが重要です。"
      },
      {
        id: 49,
        category: "内部管理態勢・3線ディフェンス",
        stem: "グループ会社や海外拠点・委託先を含むAML/CFT態勢管理において重要な考え方はどれか。",
        choices: [
          "グループ全体のリスク特性や各法域の法令・規制を踏まえつつ、一貫したグループ方針・基準のもとで情報共有や管理・監督を行う",
          "子会社や業務委託先は別法人なので、マネロン対策の状況を把握しなくてよい",
          "海外拠点では日本のルールだけを押し付け、現地の法規制は考慮しなくてよい",
          "業務委託先に任せた工程のAMLリスクは、委託元には一切帰属しない"
        ],
        answer: 0,
        explanation: "グループ・委託先を通じた資金移動や業務分担がある場合、グループベースでのリスク把握と統制、各法域の法令遵守、委託先管理が不可欠です。"
      },
      {
        id: 50,
        category: "内部管理態勢・3線ディフェンス",
        stem: "AML/CFT態勢を「形骸化させない」ために継続的に取り組むべきこととして、最も適切なものはどれか。",
        choices: [
          "定期的なリスク評価（WRA：全社的リスク評価等）の更新、アラート・調査品質のモニタリング、監査や外部環境変化を踏まえた規程・業務・システムのPDCAを回す",
          "一度マニュアルを作成したら、10年間は内容を一切見直さない",
          "問題が起きても「前例がない」として改善を見送る",
          "形だけのチェックリストにチェックを入れる作業自体を目的化する"
        ],
        answer: 0,
        explanation: "AML/CFTは静的なチェック作業ではなく、リスク評価・統制・監視・検証・改善を継続的に回すダイナミックな管理態勢です。"
      }
    ];

    const STORAGE_KEY = "aml_cbt_50_state_v1";

    let state = {
      answers: {},       // { [qId]: { selected: number, isCorrect: boolean } }
      flagged: {},       // { [qId]: boolean }
      order: QUESTIONS.map(q => q.id),
      currentIdx: 0,
      categoryFilter: "ALL",
      subsetFilter: "ALL",
      autoReveal: true,
      shuffleChoices: false,
      choiceMaps: {},    // { [qId]: [0,1,2,3] }
      elapsedSec: 0
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state = {
            ...state,
            ...parsed,
            answers: parsed.answers || {},
            flagged: parsed.flagged || {},
            choiceMaps: parsed.choiceMaps || {}
          };
          if (!Array.isArray(state.order) || state.order.length !== QUESTIONS.length) {
            state.order = QUESTIONS.map(q => q.id);
          }
        }
      } catch (e) {
        console.warn("Failed to load state:", e);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.warn("Failed to save state:", e);
      }
    }

    function getFilteredIds() {
      return state.order.filter(id => {
        const q = QUESTIONS.find(item => item.id === id);
        if (!q) return false;
        if (state.categoryFilter !== "ALL" && q.category !== state.categoryFilter) {
          return false;
        }
        const ans = state.answers[id];
        const isFlagged = !!state.flagged[id];
        if (state.subsetFilter === "WRONG") {
          return ans && !ans.isCorrect;
        }
        if (state.subsetFilter === "FLAGGED") {
          return isFlagged;
        }
        if (state.subsetFilter === "UNANSWERED") {
          return !ans;
        }
        return true;
      });
    }

    function getChoiceMap(q) {
      if (!state.shuffleChoices) {
        return [0, 1, 2, 3];
      }
      if (!state.choiceMaps[q.id] || state.choiceMaps[q.id].length !== q.choices.length) {
        const arr = [0, 1, 2, 3];
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        state.choiceMaps[q.id] = arr;
        saveState();
      }
      return state.choiceMaps[q.id];
    }

    function formatTime(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return `${m}:${s}`;
    }

    function updateHeaderStats() {
      const answeredList = Object.values(state.answers);
      const totalAnswered = answeredList.length;
      const totalCorrect = answeredList.filter(a => a.isCorrect).length;
      const rate = totalAnswered > 0 ? Math.round((totalCorrect / totalAnswered) * 100) : 0;
      document.getElementById("scoreBadge").textContent = `正答: ${totalCorrect} / ${totalAnswered} (${rate}%)`;
      document.getElementById("timerBadge").textContent = `経過: ${formatTime(state.elapsedSec)}`;
    }

    function renderPalette(filteredIds) {
      const grid = document.getElementById("paletteGrid");
      grid.innerHTML = "";

      const listToShow = filteredIds.length > 0 ? filteredIds : state.order;
      listToShow.forEach((id, idx) => {
        const btn = document.createElement("button");
        btn.className = "pal-btn";
        btn.textContent = String(id).padStart(2, "0");
        const ans = state.answers[id];
        if (ans) {
          btn.classList.add(ans.isCorrect ? "p-correct" : "p-incorrect");
        }
        if (state.flagged[id]) {
          btn.classList.add("p-flagged");
        }
        if (filteredIds.length > 0 && idx === state.currentIdx) {
          btn.classList.add("current");
        }
        btn.addEventListener("click", () => {
          document.getElementById("summaryView").style.display = "none";
          if (filteredIds.length > 0) {
            state.currentIdx = idx;
          } else {
            state.categoryFilter = "ALL";
            state.subsetFilter = "ALL";
            document.getElementById("categoryFilter").value = "ALL";
            document.getElementById("subsetFilter").value = "ALL";
            const newFiltered = getFilteredIds();
            state.currentIdx = Math.max(0, newFiltered.indexOf(id));
          }
          saveState();
          render();
        });
        grid.appendChild(btn);
      });

      const answeredCount = Object.keys(state.answers).length;
      const flaggedCount = Object.values(state.flagged).filter(Boolean).length;
      const wrongCount = Object.values(state.answers).filter(a => !a.isCorrect).length;

      document.getElementById("miniStats").innerHTML = `
        <div>解答済み: <strong>${answeredCount}</strong> / ${QUESTIONS.length} 問</div>
        <div>誤答数: <strong>${wrongCount}</strong> 問 / 要復習フラグ: <strong>${flaggedCount}</strong> 問</div>
      `;
    }

    function renderQuestion() {
      const card = document.getElementById("questionCard");
      const filteredIds = getFilteredIds();

      if (filteredIds.length === 0) {
        card.innerHTML = `
          <div class="empty-state">
            <p style="font-size:1rem; font-weight:600; margin-bottom:12px;">現在の条件に一致する問題はありません。</p>
            <button class="btn-primary" id="clearFilterBtn">フィルタを解除して全50問を表示</button>
          </div>
        `;
        document.getElementById("clearFilterBtn").addEventListener("click", () => {
          state.categoryFilter = "ALL";
          state.subsetFilter = "ALL";
          state.currentIdx = 0;
          document.getElementById("categoryFilter").value = "ALL";
          document.getElementById("subsetFilter").value = "ALL";
          saveState();
          render();
        });
        renderPalette([]);
        return;
      }

      if (state.currentIdx >= filteredIds.length) {
        state.currentIdx = 0;
      }

      const qId = filteredIds[state.currentIdx];
      const q = QUESTIONS.find(item => item.id === qId);
      const ans = state.answers[q.id];
      const isFlagged = !!state.flagged[q.id];
      const choiceMap = getChoiceMap(q);
      const labels = ["A", "B", "C", "D"];

      let choicesHtml = "";
      choiceMap.forEach((origIdx, dispIdx) => {
        let cls = "choice-btn";
        if (ans) {
          if (origIdx === q.answer) {
            cls += " correct";
          } else if (origIdx === ans.selected && !ans.isCorrect) {
            cls += " incorrect";
          }
        }
        choicesHtml += `
          <button class="${cls}" data-orig-idx="${origIdx}">
            <span class="choice-key">${labels[dispIdx]}</span>
            <span>${escapeHtml(q.choices[origIdx])}</span>
          </button>
        `;
      });

      const showExplanation = !!ans && state.autoReveal;
      const correctDispIdx = choiceMap.indexOf(q.answer);
      const correctLabel = labels[correctDispIdx] || "";

      let expHtml = "";
      if (ans && !state.autoReveal) {
        expHtml = `
          <div class="explanation-box">
            <p class="exp-title">解答を記録しました（解説非表示モード中）</p>
            <button id="showSingleExpBtn">この問題の解説を表示</button>
          </div>
        `;
      } else if (showExplanation) {
        const boxCls = ans.isCorrect ? "is-correct" : "is-incorrect";
        const verdict = ans.isCorrect ? "○ 正解です！" : `× 不正解（正解：${correctLabel}）`;
        expHtml = `
          <div class="explanation-box ${boxCls}" id="expBox">
            <p class="exp-title">${verdict}</p>
            <p class="exp-body">${escapeHtml(q.explanation)}</p>
          </div>
        `;
      }

      card.innerHTML = `
        <div class="q-meta">
          <div class="q-tags">
            <span class="q-num">第${q.id}問</span>
            <span class="q-cat">${escapeHtml(q.category)}</span>
            <span style="font-size:0.82rem; color:var(--muted);">(${state.currentIdx + 1} / ${filteredIds.length}件表示中)</span>
          </div>
          <button class="flag-btn ${isFlagged ? "flagged" : ""}" id="flagBtn">
            ${isFlagged ? "★ 要復習フラグ済" : "☆ 要復習フラグ"}
          </button>
        </div>

        <p class="q-stem">${escapeHtml(q.stem)}</p>

        <div class="choices" id="choicesContainer">
          ${choicesHtml}
        </div>

        <div id="explanationArea">${expHtml}</div>

        <div class="q-nav">
          <button id="prevBtn" ${state.currentIdx === 0 ? "disabled" : ""}>← 前の問題</button>
          <div style="display:flex; gap:8px;">
            ${ans ? `<button id="clearAnsBtn">この問題の解答を消す</button>` : ""}
            <button class="btn-primary" id="nextBtn" ${state.currentIdx >= filteredIds.length - 1 ? "disabled" : ""}>次の問題 →</button>
          </div>
        </div>
      `;

      document.getElementById("flagBtn").addEventListener("click", () => {
        state.flagged[q.id] = !state.flagged[q.id];
        if (!state.flagged[q.id]) delete state.flagged[q.id];
        saveState();
        render();
      });

      document.querySelectorAll("#choicesContainer .choice-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const selectedOrig = Number(btn.getAttribute("data-orig-idx"));
          state.answers[q.id] = {
            selected: selectedOrig,
            isCorrect: selectedOrig === q.answer
          };
          saveState();
          render();
        });
      });

      const showSingleExpBtn = document.getElementById("showSingleExpBtn");
      if (showSingleExpBtn) {
        showSingleExpBtn.addEventListener("click", () => {
          const boxCls = ans.isCorrect ? "is-correct" : "is-incorrect";
          const verdict = ans.isCorrect ? "○ 正解です！" : `× 不正解（正解：${correctLabel}）`;
          document.getElementById("explanationArea").innerHTML = `
            <div class="explanation-box ${boxCls}">
              <p class="exp-title">${verdict}</p>
              <p class="exp-body">${escapeHtml(q.explanation)}</p>
            </div>
          `;
        });
      }

      const clearAnsBtn = document.getElementById("clearAnsBtn");
      if (clearAnsBtn) {
        clearAnsBtn.addEventListener("click", () => {
          delete state.answers[q.id];
          saveState();
          render();
        });
      }

      document.getElementById("prevBtn").addEventListener("click", () => {
        if (state.currentIdx > 0) {
          state.currentIdx -= 1;
          saveState();
          render();
        }
      });

      document.getElementById("nextBtn").addEventListener("click", () => {
        if (state.currentIdx < filteredIds.length - 1) {
          state.currentIdx += 1;
          saveState();
          render();
        }
      });

      renderPalette(filteredIds);
    }

    function renderSummary() {
      const categories = [
        "顧客管理（CDD/EDD）",
        "取引モニタリング・分析",
        "疑わしい取引の届出（STR）",
        "金融制裁・海外送金・暗号資産",
        "内部管理態勢・3線ディフェンス"
      ];

      let rows = "";
      categories.forEach(cat => {
        const qs = QUESTIONS.filter(q => q.category === cat);
        const total = qs.length;
        let answered = 0;
        let correct = 0;
        qs.forEach(q => {
          const a = state.answers[q.id];
          if (a) {
            answered += 1;
            if (a.isCorrect) correct += 1;
          }
        });
        const pct = answered > 0 ? `${Math.round((correct / answered) * 100)}%` : "-";
        rows += `
          <tr>
            <td><strong>${escapeHtml(cat)}</strong></td>
            <td>${answered} / ${total}</td>
            <td>${correct} / ${answered}</td>
            <td>${pct}</td>
          </tr>
        `;
      });

      document.getElementById("summaryContent").innerHTML = `
        <table class="summary-table">
          <thead>
            <tr>
              <th>分野</th>
              <th>解答数</th>
              <th>正答数（解答済対比）</th>
              <th>正答率</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function render() {
      updateHeaderStats();
      renderQuestion();
      renderSummary();
    }

    // Event bindings
    document.getElementById("categoryFilter").addEventListener("change", e => {
      state.categoryFilter = e.target.value;
      state.currentIdx = 0;
      saveState();
      render();
    });

    document.getElementById("subsetFilter").addEventListener("change", e => {
      state.subsetFilter = e.target.value;
      state.currentIdx = 0;
      saveState();
      render();
    });

    document.getElementById("shuffleBtn").addEventListener("click", () => {
      const arr = [...state.order];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      state.order = arr;
      state.currentIdx = 0;
      saveState();
      render();
    });

    document.getElementById("autoRevealCheck").addEventListener("change", e => {
      state.autoReveal = e.target.checked;
      saveState();
      render();
    });

    document.getElementById("shuffleChoicesCheck").addEventListener("change", e => {
      state.shuffleChoices = e.target.checked;
      state.choiceMaps = {};
      saveState();
      render();
    });

    document.getElementById("toggleSummaryBtn").addEventListener("click", () => {
      const el = document.getElementById("summaryView");
      const willShow = el.style.display === "none";
      renderSummary();
      el.style.display = willShow ? "block" : "none";
    });

    document.getElementById("closeSummaryBtn").addEventListener("click", () => {
      document.getElementById("summaryView").style.display = "none";
    });

    document.getElementById("retryWrongBtn").addEventListener("click", () => {
      state.categoryFilter = "ALL";
      state.subsetFilter = "WRONG";
      state.currentIdx = 0;
      document.getElementById("categoryFilter").value = "ALL";
      document.getElementById("subsetFilter").value = "WRONG";
      document.getElementById("summaryView").style.display = "none";
      saveState();
      render();
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      if (!confirm("解答履歴・フラグ・経過時間をすべてリセットしますか？")) return;
      state.answers = {};
      state.flagged = {};
      state.choiceMaps = {};
      state.currentIdx = 0;
      state.elapsedSec = 0;
      saveState();
      render();
    });

    setInterval(() => {
      state.elapsedSec += 1;
      updateHeaderStats();
      if (state.elapsedSec % 10 === 0) {
        saveState();
      }
    }, 1000);

    // Initialize UI controls from state
    loadState();
    document.getElementById("categoryFilter").value = state.categoryFilter;
    document.getElementById("subsetFilter").value = state.subsetFilter;
    document.getElementById("autoRevealCheck").checked = state.autoReveal;
    document.getElementById("shuffleChoicesCheck").checked = state.shuffleChoices;
    render();
  </script>
</body>
</html>
